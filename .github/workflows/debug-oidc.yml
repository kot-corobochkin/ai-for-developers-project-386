name: debug-oidc

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Get OIDC token
        id: oidc
        shell: bash
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=opencode-github-action")
          echo "$TOKEN" > /tmp/oidc.json
          echo "VALUE_LEN: $(python3 -c "import json; print(len(json.load(open('/tmp/oidc.json'))['value']))")"
          python3 -c "
          import json,base64
          v=json.load(open('/tmp/oidc.json'))['value']
          payload=v.split('.')[1]
          payload+='='*(-len(payload)%4)
          c=json.loads(base64.urlsafe_b64decode(payload))
          print('CLAIMS:', json.dumps({k:c.get(k) for k in ['iss','aud','sub','exp','iat']}))
          "

      - name: Check app installation
        shell: bash
        run: |
          echo "--- get_github_app_installation ---"
          curl -sS -w "\nHTTP:%{http_code}\n" \
            "https://api.opencode.ai/get_github_app_installation?owner=kot-corobochkin&repo=calendar-service"
          echo

      - name: Exchange OIDC token
        shell: bash
        run: |
          VALUE=$(python3 -c "import json; print(json.load(open('/tmp/oidc.json'))['value'])")
          echo "--- exchange_github_app_token ---"
          curl -sS -w "\nHTTP:%{http_code} size:%{size_download}\n" \
            -X POST https://api.opencode.ai/exchange_github_app_token \
            -H "Authorization: Bearer $VALUE" \
            -H "Content-Type: application/json" \
            -o /tmp/exchange.txt
          head -c 500 /tmp/exchange.txt
          echo
